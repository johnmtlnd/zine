<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1A18" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A09" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Archive</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="theme-cuts.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="cuts.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="texture" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<!-- ============ AUTH ============ -->
<section id="auth" hidden>

  <div class="auth__top">
    <div class="auth__scatter" aria-hidden="true">
      <span>Missives</span>
      <span>Scraps</span>
      <span>T-shirts</span>
      <span>Band names</span>
      <span>Quips</span>
      <span>Ideas</span>
    </div>
    <p class="auth__welcome">Welcome to</p>
    <!-- app.js writes CONFIG.NAME in here -->
    <h1 class="auth__title" id="auth-name">Off Cuts</h1>
  </div>

  <div class="auth__panel">
    <div class="auth__form">
      <label for="auth-email">Email address</label>
      <input id="auth-email" type="email" inputmode="email"
             autocomplete="email" placeholder="example@email.com">
      <button id="auth-send">Send me a magic link</button>
      <p id="auth-msg" role="status" aria-live="polite"></p>
    </div>

    <p class="auth__foot">Just for us</p>
  </div>

</section>

<!-- ============ MAIN ============
     From the Figma prototype: a black masthead, the categories as a
     big serif list, and every post living in a sheet that peeks up
     from the bottom ("All posts"). On a wide screen the sheet stops
     being a sheet and becomes the right-hand pane. -->
<main id="main" hidden>

  <header class="top" id="top">
    <h1 class="top__name" id="masthead-name">Off Cuts</h1>
    <button class="top__btn" id="btn-compose" title="New idea" aria-label="New idea">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4.5v15M4.5 12h15"/></svg>
    </button>
    <button class="top__btn" id="btn-settings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </header>

  <div class="home" id="home">
    <nav class="cats" id="cats" aria-label="Categories"><!-- rows injected --></nav>
    <p class="empty" id="empty" hidden>Nothing yet. Tap + to start the pile.</p>
  </div>

  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <section class="posts" id="posts" aria-label="Posts">
    <div class="posts__grab" id="posts-grab" aria-hidden="true"><i></i></div>
    <button class="posts__peek" id="posts-peek" type="button">All posts</button>
    <div class="posts__panel" id="posts-panel">
      <div class="posts__head" id="posts-head">
        <div class="posts__title" id="posts-title" hidden>
          <span id="posts-title-text"></span>
          <button class="posts__clear" id="posts-clear" type="button" aria-label="Show all posts">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="posts__bar">
          <div class="media" role="group" aria-label="Show">
            <button class="media__btn media__btn--all" id="m-all" type="button" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3Z"/></svg>
              <span>All</span>
            </button>
            <button class="media__btn" id="m-photo" type="button" aria-pressed="false" aria-label="Photos only" title="Photos">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3.5 8.5a2 2 0 0 1 2-2h2.2l1.5-2h5.6l1.5 2h2.2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-9Z"/><circle cx="12" cy="12.8" r="3.3"/></svg>
            </button>
            <button class="media__btn" id="m-audio" type="button" aria-pressed="false" aria-label="Voice notes only" title="Voice notes">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16v-3.5a7.5 7.5 0 0 1 15 0V16"/><rect x="3.5" y="14" width="4" height="5.5" rx="1.6"/><rect x="16.5" y="14" width="4" height="5.5" rx="1.6"/></svg>
            </button>
          </div>
          <label class="sort">
            <span id="sort-label">Sort by</span>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 9 7 7 7-7"/></svg>
            <select id="sort" aria-label="Sort posts">
              <option value="new">Newest first</option>
              <option value="old">Oldest first</option>
              <option value="shuffle">Shuffle</option>
            </select>
          </label>
        </div>
      </div>
      <div class="feed" id="feed"></div>
    </div>
  </section>

</main>

<!-- ============ COMPOSER ============
     A modal on a wide screen, a sheet from the bottom on a phone.
     Same element; the breakpoint decides which. -->
<dialog class="sheet" id="compose" aria-labelledby="compose-name">
  <div class="sheet__grab" id="compose-grab" aria-hidden="true"><i></i></div>
  <div class="sheet__head">
    <span class="avatar avatar--lg" id="compose-avatar" aria-hidden="true"></span>
    <div class="sheet__col">
      <div class="sheet__top">
        <span class="sheet__name" id="compose-name"></span>
        <button class="sheet__clear" id="btn-clear" type="button" hidden>Clear</button>
      </div>
      <textarea class="composer" id="composer" rows="3"
                placeholder="What&rsquo;s the idea?"
                autocomplete="off" autocapitalize="sentences"></textarea>
      <div class="sheet__row" id="attached" hidden></div>
      <div class="sheet__row" id="typebar"><!-- type chips injected --></div>
    </div>
  </div>
  <div class="sheet__bar">
    <button class="sheet__tool" id="btn-photo" type="button" title="Add a photo" aria-label="Add a photo">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="9" cy="9" r="1.8"/><path d="m21 15-4.5-4.5L6 21"/></svg>
    </button>
    <input type="file" id="photo-input" accept="image/*" hidden>
    <button class="sheet__tool sheet__tool--rec" id="btn-rec" type="button" title="Hold to record" aria-label="Hold to record">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
    </button>
    <span class="rectimer" id="rectimer"></span>
    <span class="spacer"></span>
    <button class="sheet__cancel" id="btn-cancel" type="button">Cancel</button>
    <button class="commit" id="btn-commit" type="button" disabled>Keep it</button>
  </div>
</dialog>

<!-- ============ DETAIL / SHUFFLE ============
     One component doing two jobs: tapping a card and hitting
     shuffle both land here. Full bleed, one idea, the thread. -->
<section class="shuffle" id="detail" hidden>
  <div class="shuffle__label" id="detail-label"></div>
  <div class="shuffle__body" id="detail-body"></div>
  <div class="shuffle__foot">
    <button class="chip" id="detail-close">‹ Back</button>
    <button class="chip" id="detail-again" hidden>Again</button>
    <span class="spacer"></span>
    <button class="chip chip--ghost" id="detail-delete">Delete</button>
  </div>
</section>

<!-- ============ SETTINGS ============ -->
<section class="shuffle" id="settings" hidden style="grid-template-rows:auto 1fr">
  <div class="shuffle__label">Settings</div>
  <div style="overflow:auto">
    <div class="group">
    <div class="row">
      <span class="row__label">Your name</span>
      <input class="field" id="set-name" style="width:auto;margin:0;max-width:55%">
    </div>
    <div class="row">
      <span class="row__label">Notifications</span>
      <button class="chip" id="set-push">Turn on</button>
    </div>
    <div class="row">
      <span class="row__label">Add a type</span>
      <input class="field" id="set-type" placeholder="Tote bag" style="width:auto;margin:0;max-width:55%">
    </div>
    <div class="row">
      <span class="row__label">Sign out</span>
      <button class="chip" id="set-signout">Sign out</button>
    </div>
    </div>
    <p style="margin-top:24px;color:var(--ink-soft);font-size:.85rem" id="set-status"></p>
    <button class="chip" id="set-close">Done</button>
  </div>
</section>

<div class="offline" id="offline-banner" hidden>Offline — saved here, will sync</div>

<script type="module" src="app.js"></script>
</body>
</html>
